android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx2048m

# ==================== Toa do Maven cua SDK ====================
# groupId phai la namespace da verify tren https://central.sonatype.com
#   - nhanh nhat: io.github.<github-username>
#   - hoac domain cong ty (can them ban ghi TXT vao DNS de verify)
sdkGroupId=io.github.idaflatform
sdkVersion=1.0.0

# Thong tin POM bat buoc cua Maven Central
sdkProjectUrl=https://github.com/idaflatform/fpt-consent-sdk
sdkScmConnection=scm:git:git://github.com/idaflatform/fpt-consent-sdk.git
sdkScmDeveloperConnection=scm:git:ssh://git@github.com/idaflatform/fpt-consent-sdk.git
sdkDeveloperId=idaflatform
sdkDeveloperName=idaflatform

# ==================== Bi mat — KHONG commit ====================
# Dat 4 gia tri sau trong ~/.gradle/gradle.properties (hoac bien moi truong ORG_GRADLE_PROJECT_*):
#   mavenCentralUsername=<user token tu Central Portal>
#   mavenCentralPassword=<password token tu Central Portal>
#   signingInMemoryKey=<private key GPG dang armor, bo dong BEGIN/END, khong xuong dong>
#   signingInMemoryKeyPassword=<passphrase cua khoa GPG>

# ==================== Maven noi bo (tuy chon) ====================
# Chi khai khi muon day len Nexus/Artifactory thay vi Maven Central:
# cmpRepoUrl=https://nexus.example.vn/repository/maven-releases/
# cmpRepoUser=deployer
# cmpRepoPassword=***
