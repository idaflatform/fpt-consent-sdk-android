android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx2048m

# ==================== Toa do Maven cua SDK ====================
# groupId phai la namespace da verify tren https://central.sonatype.com
#   - nhanh nhat: io.github.<github-username>
#   - hoac domain cong ty (can them ban ghi TXT vao DNS de verify)
sdkGroupId=io.github.idaplatform
# Phai khop version dang phat hanh tren README — quen -PsdkVersion khi publish thi dung gia tri nay.
sdkVersion=1.2.0

# Thong tin POM bat buoc cua Maven Central
sdkProjectUrl=https://github.com/idaplatform/fpt-consent-sdk-android
sdkScmConnection=scm:git:https://github.com/idaplatform/fpt-consent-sdk-android.git
sdkScmDeveloperConnection=scm:git:ssh://git@github.com/idaplatform/fpt-consent-sdk-android.git
sdkDeveloperId=idaplatform
sdkDeveloperName=idaplatform

# ==================== Bi mat — KHONG commit ====================
# Dat 4 gia tri sau trong ~/.gradle/gradle.properties (hoac bien moi truong ORG_GRADLE_PROJECT_*):
#   mavenCentralUsername=<user token tu Central Portal>
#   mavenCentralPassword=<password token tu Central Portal>
#   signingInMemoryKey=<private key GPG dang armor day du, giu BEGIN/END, dung \\n cho xuong dong>
#   signingInMemoryKeyPassword=<passphrase cua khoa GPG>

# ==================== Maven noi bo (tuy chon) ====================
# Chi khai khi muon day len Nexus/Artifactory thay vi Maven Central:
# cmpRepoUrl=https://nexus.example.vn/repository/maven-releases/
# cmpRepoUser=deployer
# cmpRepoPassword=***
