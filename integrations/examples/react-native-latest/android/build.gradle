buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects { repositories { if (System.getenv('CMP_MAVEN_REPO')) maven { url = uri(System.getenv('CMP_MAVEN_REPO')) }; if (System.getenv('CMP_BRIDGE_MAVEN_REPO')) maven { url = uri(System.getenv('CMP_BRIDGE_MAVEN_REPO')) } } }
