pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google(); mavenCentral()
        def repo = providers.gradleProperty('cmpMavenRepo').orNull ?: System.getenv('CMP_MAVEN_REPO')
        if (repo) maven { url = uri(repo) }
    }
}
rootProject.name = 'cmp-mobile-integrations'
include ':java-example', ':compose-example'
include ':mobile-bridge'
