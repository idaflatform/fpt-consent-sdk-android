name: cmp_consent
description: Native CMP consent forms and submission for Flutter Android and iOS.
version: 0.1.0
environment:
  sdk: ^3.9.2
  flutter: '>=3.35.0'
dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  plugin:
    platforms:
      android:
        package: vn.fpt.cmp.cmp_consent
        pluginClass: MobileConsentPlugin
      ios:
        pluginClass: MobileConsentPlugin
