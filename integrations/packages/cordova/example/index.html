<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CMP Cordova</title></head><body>
<h1>CMP Cordova</h1><input id="key" placeholder="Integration key"><input id="origin" value="https://cmp.biznext.vn"><button id="open">Consent độc lập</button><button id="register">Đăng ký native</button><pre id="result"></pre><script src="cordova.js"></script>
<script>document.addEventListener('deviceready',function(){[['open',false],['register',true]].forEach(function(pair){document.getElementById(pair[0]).onclick=function(){CmpConsent.present({codeConfig:document.getElementById('key').value,baseUrl:document.getElementById('origin').value,embedded:pair[1],values:{Email:'demo@example.invalid'}}).then(function(result){document.getElementById('result').textContent=JSON.stringify(result);}).catch(function(e){document.getElementById('result').textContent=String(e);});};});});</script></body></html>
