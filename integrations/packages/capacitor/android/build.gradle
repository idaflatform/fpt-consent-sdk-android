buildscript {repositories{google();mavenCentral()};dependencies{classpath 'com.android.tools.build:gradle:8.7.0'}}
apply plugin:'com.android.library'
android {namespace 'vn.fpt.cmp.capacitor';compileSdk 35;defaultConfig{minSdk 23};compileOptions{sourceCompatibility JavaVersion.VERSION_11;targetCompatibility JavaVersion.VERSION_11}}
repositories{google();mavenCentral();if(System.getenv('CMP_MAVEN_REPO'))maven{url=uri(System.getenv('CMP_MAVEN_REPO'))};if(System.getenv('CMP_BRIDGE_MAVEN_REPO'))maven{url=uri(System.getenv('CMP_BRIDGE_MAVEN_REPO'))}}
dependencies{implementation project(':capacitor-android');implementation 'vn.fpt.cmp:mobile-bridge:0.1.0'}
