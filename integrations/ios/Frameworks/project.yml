name: CMPFrameworks
options:
  deploymentTarget:
    iOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    BUILD_LIBRARY_FOR_DISTRIBUTION: YES
    SKIP_INSTALL: NO
    GENERATE_INFOPLIST_FILE: YES
    DEFINES_MODULE: YES
targets:
  ConsentCmp:
    type: framework
    platform: iOS
    sources:
      - path: ${CMP_IOS_SDK_PATH}/Sources/ConsentCmp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.fpt.cmp.sdk
  CMPMobileBridge:
    type: framework
    platform: iOS
    sources: [../Bridge/Sources/CMPMobileBridge]
    dependencies:
      - target: ConsentCmp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.fpt.cmp.mobilebridge
